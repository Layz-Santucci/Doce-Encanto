<nav class="navbar navbar-expand-lg navbar-dark navbar-vitrine sticky-top">
  <div class="container">
    <a class="navbar-brand logo-vitrine" routerLink="/">🍬 Doce Encanto</a>

    <button class="navbar-toggler" type="button" (click)="menuAberto = !menuAberto"
            aria-label="Abrir menu" [attr.aria-expanded]="menuAberto">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" [class.show]="menuAberto">
      <!-- Busca (exigida em todas as telas do PWEB_P1.pdf) -->
      <form class="d-flex mx-lg-auto my-2 my-lg-0 busca" role="search" (ngSubmit)="buscarAgora()">
        <input class="form-control" type="search" placeholder="🔍 Buscar doces..."
               name="termo" [ngModel]="termo()" (ngModelChange)="termo.set($event)" aria-label="Buscar doces">
      </form>

      <ul class="navbar-nav ms-lg-3 align-items-lg-center gap-lg-1">
        <li class="nav-item">
          <a class="nav-link" routerLink="/vitrine" routerLinkActive="active" (click)="menuAberto = false">Vitrine</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/busca" routerLinkActive="active" (click)="menuAberto = false">Produtos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/cesta" routerLinkActive="active" (click)="menuAberto = false">
            Cesta
            @if (cesta.quantidadeTotal() > 0) {
              <span class="badge rounded-pill bg-light text-dark">{{ cesta.quantidadeTotal() }}</span>
            }
          </a>
        </li>

        @if (sessao.cliente(); as cliente) {
          <li class="nav-item">
            <a class="nav-link" routerLink="/pedidos" routerLinkActive="active" (click)="menuAberto = false">Meus pedidos</a>
          </li>
          <li class="nav-item">
            <span class="navbar-text text-white me-2">👤 Olá, {{ cliente.nome }}</span>
          </li>
          <li class="nav-item">
            <button class="btn btn-outline-light btn-sm" (click)="sair()">Sair</button>
          </li>
        } @else {
          <li class="nav-item">
            <a class="nav-link" routerLink="/login" routerLinkActive="active" (click)="menuAberto = false">👤 Entrar</a>
          </li>
          <li class="nav-item">
            <a class="btn btn-doce btn-sm px-3" routerLink="/cadastro" (click)="menuAberto = false">Cadastrar</a>
          </li>
        }
      </ul>
    </div>
  </div>
</nav>
