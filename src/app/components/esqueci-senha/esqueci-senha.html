<div class="container d-flex justify-content-center my-5">
  <div class="card p-4 shadow-sm" style="max-width: 400px; width: 100%;">
    <h3 class="text-center mb-4">Recuperar Senha</h3>

    <div class="alert alert-success" *ngIf="enviado">
      Um link de redefinição foi enviado para o seu e-mail.
    </div>

    <div class="mb-3" *ngIf="!enviado">
      <label for="emailRecuperacao" class="form-label">Informe seu e-mail cadastrado</label>
      <input id="emailRecuperacao" type="email" class="form-control" [(ngModel)]="email">
    </div>

    <button class="btn btn-doce w-100" (click)="reenviarSenha()" *ngIf="!enviado">
      Reenviar Senha
    </button>
  </div>
</div>
