<div class="container my-5" id="paginaLogin">
  <div class="card p-4 shadow-sm mx-auto form-login" style="max-width: 400px;">
    <h3 class="text-center mb-4">Entrar</h3>

    <!-- Mensagem de erro -->
    <div *ngIf="erro" class="alert alert-danger py-2 text-center" style="background-color: #f8d7da; color: #721c24; border-color: #f5c6cb;">
      {{ erro }}
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">E-mail</label>
      <input id="email" type="email" class="form-control" [(ngModel)]="email" name="email">
    </div>

    <div class="mb-3">
      <label for="senha" class="form-label">Senha</label>
      <input id="senha" type="password" class="form-control" [(ngModel)]="senha" name="senha">
    </div>

    <!-- O botão DEVE ter (click)="fazerLogin()" -->
    <button class="btn btn-doces w-100" (click)="fazerLogin()">Entrar</button>

    <div class="text-center mt-3">
      <a routerLink="/esqueci-senha">Esqueci minha senha</a>
    </div>
  </div>
</div>
