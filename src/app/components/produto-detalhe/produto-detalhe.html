<div class="container my-4">
  <div class="row g-4">
    <div class="col-md-5">
      <img [src]="produto.imagem" class="img-fluid rounded shadow-sm" [alt]="produto.nome">
    </div>
    <div class="col-md-7">
      <!-- restante do código -->
      <h2>{{ produto.nome }}</h2>
      <p class="text-muted">{{ produto.descricao }}</p>
      <h4 class="text-success">R$ {{ produto.preco.toFixed(2) }}</h4>

      <div class="d-flex align-items-center gap-2 my-3">
        <label for="qtd" class="form-label mb-0">Quantidade:</label>
        <input id="qtd" type="number" class="form-control" style="width: 80px"
               [(ngModel)]="quantidade" min="1">
      </div>

      <button class="btn btn-doce btn-lg" (click)="adicionarNaCesta()">
        Adicionar à Cesta
      </button>
      <!-- Mensagem de sucesso  -->
<div *ngIf="mensagemSucesso" class="alert alert-success mt-3 text-center" style="background-color: #f8d7da; color: #721c24; border-color: #f5c6cb;">
  Produto adicionado à cesta com sucesso! 🛒
</div>
    </div>
  </div>
</div>
