<div class="container my-4" id="paginaCesta">
  <h2 class="text-center mb-4">Minha Cesta de Compras</h2>

  <!-- Quando a cesta estiver vazia -->
<div *ngIf="cesta.itens.length === 0" class="text-center py-5">
    <p class="text-muted">A sua cesta está vazia.</p>
    <a routerLink="/" class="btn btn-doces mt-2">Voltar à Vitrine</a>
  </div>

  <!-- Lista de itens  -->
  <div class="row g-3 mb-3" *ngFor="let item of cesta.itens">
    <div class="col-12">
      <div class="card shadow-sm p-2">
        <div class="row g-0 align-items-center">
          
          <!-- Imagem Local baseada no ID do Produto -->
          <div class="col-md-2 text-center">
            <img [src]="item.idProduto === 1 ? 'doces/Brigadeiro.jpg' : 
                          item.idProduto === 2 ? 'doces/Brownie.jpg' : 
                          item.idProduto === 3 ? 'doces/Cupcake.jpg' : 'doces/Pavê .jpg'" 
                 [alt]="item.nome" 
                 class="img-fluid rounded" 
                 style="max-height: 80px; width: 80px; object-fit: cover;">
          </div>

          <div class="col-md-4">
            <div class="card-body">
              <h5 class="card-title mb-1">{{ item.nome }}</h5>
              <p class="card-text text-muted mb-0">R$ {{ item.preco.toFixed(2) }} / unidade</p>
            </div>
          </div>

          <div class="col-md-3 d-flex align-items-center justify-content-center gap-2">
            <button class="btn btn-sm btn-outline-secondary" (click)="diminuir(item)">-</button>
            <span class="px-2">{{ item.quantidade }}</span>
            <button class="btn btn-sm btn-outline-secondary" (click)="aumentar(item)">+</button>
          </div>

          <div class="col-md-3 text-end pe-3">
            <p class="fw-bold mb-1">R$ {{ item.subtotal.toFixed(2) }}</p>
            <button class="btn btn-sm btn-danger" (click)="remover(item)">Remover</button>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- Bloco do Total e Finalizar Pedido  -->
  <div class="d-flex justify-content-between align-items-center mt-4 p-3 border bg-light rounded shadow-sm" *ngIf="cesta.itens.length > 0">
    <h4 class="mb-0">Total: <span class="text-success">R$ {{ cesta.total.toFixed(2) }}</span></h4>
    <button class="btn btn-doces btn-lg" (click)="finalizarPedido()">Finalizar Pedido</button>
  </div>
</div>
